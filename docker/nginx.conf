server {
    listen 3000;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location = /home {
        return 301 /;
    }

    location = /home/ {
        return 301 /;
    }

    location = /servizi {
        return 301 /soluzioni/;
    }

    location = /servizi/ {
        return 301 /soluzioni/;
    }

    location = /servizi/annunci-funebri-necrologi {
        return 301 /soluzioni/annunci-funebri-necrologi/;
    }

    location = /servizi/annunci-funebri-necrologi/ {
        return 301 /soluzioni/annunci-funebri-necrologi/;
    }

    location = /servizi/gestionale-eterno {
        return 301 /soluzioni/gestionale-eterno/;
    }

    location = /servizi/gestionale-eterno/ {
        return 301 /soluzioni/gestionale-eterno/;
    }

    location = /servizi/editor-grafico-giotto {
        return 301 /soluzioni/editor-grafico-giotto/;
    }

    location = /servizi/editor-grafico-giotto/ {
        return 301 /soluzioni/editor-grafico-giotto/;
    }

    location = /servizi/streaming-cerimonia {
        return 301 /soluzioni/streaming-cerimonia/;
    }

    location = /servizi/streaming-cerimonia/ {
        return 301 /soluzioni/streaming-cerimonia/;
    }

    location = /servizi/siti-web-impresa-funebre {
        return 301 /soluzioni/siti-web-app-imprese-funebri/;
    }

    location = /servizi/siti-web-impresa-funebre/ {
        return 301 /soluzioni/siti-web-app-imprese-funebri/;
    }

    location = /servizi/monitor-vetrina-e-case-funerarie {
        return 301 /soluzioni/monitor-case-funerarie/;
    }

    location = /servizi/monitor-vetrina-e-case-funerarie/ {
        return 301 /soluzioni/monitor-case-funerarie/;
    }

    location = /promo-case-funerarie {
        return 301 /soluzioni/monitor-case-funerarie/;
    }

    location = /promo-case-funerarie/ {
        return 301 /soluzioni/monitor-case-funerarie/;
    }

    location = /monitor-case-funerarie {
        return 301 /soluzioni/monitor-case-funerarie/;
    }

    location = /monitor-case-funerarie/ {
        return 301 /soluzioni/monitor-case-funerarie/;
    }

    location = /offerta-dedicata {
        return 301 /offerta-dedicata/;
    }

    location = /offerta-dedicata/events {
        client_max_body_size 16k;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host europe-west1-caspersales-ea7cc.cloudfunctions.net;
        proxy_pass https://europe-west1-caspersales-ea7cc.cloudfunctions.net/landingEvents;
    }

    location = /offerta-dedicata/privacy/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri/index.html =404;
    }

    location = /offerta-dedicata/booking {
        client_max_body_size 2k;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host europe-west1-caspersales-ea7cc.cloudfunctions.net;
        proxy_pass https://europe-west1-caspersales-ea7cc.cloudfunctions.net/landingBooking;
    }

    location ~ ^/offerta-dedicata/(?:assets/|[^/]+\.(?:css|js|json)$) {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location /offerta-dedicata/ {
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host europe-west1-caspersales-ea7cc.cloudfunctions.net;
        proxy_pass https://europe-west1-caspersales-ea7cc.cloudfunctions.net/landingPage/;
    }

    # Astro builds pages in directory format (es. /chi-siamo/index.html)
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Asset di build con hash: cache lunga e immutabile
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/_astro-casper-v[0-9]+/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
