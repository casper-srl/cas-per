name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and push (e.g. v0.1.0)'
        required: false
        type: string

jobs:
  checks:
    name: Build Astro
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Resolve source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check repository
        run: npm run check

      - name: Build Astro site
        env:
          PUBLIC_BUILD_SHA: ${{ steps.source.outputs.commit }}
        run: npm run build

      - name: Verify consent-first tracking markup
        run: npm run check:tracking

      - name: Verify generated routes and commit marker
        env:
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          test -f dist/index.html
          test -f dist/promo-case-funerarie/index.html
          test -f dist/lp/monitor-structure-demo/email/index.html
          test -f dist/lp/monitor-structure-demo/whatsapp/index.html
          test "$(jq -r .commit dist/version.json)" = "$EXPECTED_COMMIT"

  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read version and detect new release
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major_minor=${VERSION%.*}" >> $GITHUB_OUTPUT
          RELEASE=false
          if [ "${{ github.ref }}" = "refs/heads/main" ] && ! git ls-remote --tags origin "v$VERSION" | grep -q "refs/tags/v$VERSION"; then
            RELEASE=true
          fi
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          DEPLOY=false
          if [ "$RELEASE" = "true" ] || [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOY=true
          fi
          echo "deploy=$DEPLOY" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/casper-srl/cas-per
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.release }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.release }}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            PUBLIC_BUILD_SHA=${{ steps.source.outputs.commit }}
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create version tag
        if: steps.version.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: "Nuova release v${{ steps.version.outputs.version }} generata automaticamente tramite cambio versione in package.json."
          draft: false
          prerelease: false

      - name: Trigger Portainer redeploy
        if: steps.version.outputs.deploy == 'true'
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          test -n "$PORTAINER_WEBHOOK_URL"
          curl -fsS --retry 3 --retry-all-errors -X POST \
            "$PORTAINER_WEBHOOK_URL?tag=${{ steps.version.outputs.version }}" \
            -w '\nHTTP %{http_code}\n'
