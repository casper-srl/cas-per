name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and push (e.g. v0.1.0)'
        required: false
        type: string

jobs:
  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Read version and detect new release
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major_minor=${VERSION%.*}" >> $GITHUB_OUTPUT
          RELEASE=false
          if [ "${{ github.ref }}" = "refs/heads/main" ] && ! git ls-remote --tags origin "v$VERSION" | grep -q "refs/tags/v$VERSION"; then
            RELEASE=true
          fi
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          DEPLOY=false
          if [ "$RELEASE" = "true" ] || [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOY=true
          fi
          echo "deploy=$DEPLOY" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/casper-srl/cas-per
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.release }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.release }}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create version tag
        if: steps.version.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: "Nuova release v${{ steps.version.outputs.version }} generata automaticamente tramite cambio versione in package.json."
          draft: false
          prerelease: false

      - name: Trigger Portainer redeploy
        if: steps.version.outputs.deploy == 'true'
        run: |
          curl -fsS --retry 3 --retry-all-errors -X POST \
            "https://portainer-casper.cjampon.ltd/api/webhooks/72c1dfe0-402c-4cc2-9191-7a5226e0afd9?tag=${{ steps.version.outputs.version }}" \
            -w '\nHTTP %{http_code}\n'
